name: Uptime Check

on:
  schedule:
    # Run every minute
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  check:
    name: Run HTTP checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        run: |
          curl --fail --silent --show-error \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/check"
